name: Build Xenity Engine

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Editor
      run: msbuild Xenity_Engine.sln /p:Configuration="Release Editor" /p:Platform=x64 /v:minimal

    # 🔍 Find the built EXE and store its folder
    - name: Find EXE
      run: |
        $exe = Get-ChildItem -Recurse -Filter *.exe | Select-Object -First 1
        if (-not $exe) {
          Write-Error "No EXE found!"
          exit 1
        }
        echo "EXE_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
        echo "Found EXE at: $($exe.FullName)"

    # 📦 Zip ONLY the correct output folder
    - name: Zip Output
      run: |
        Compress-Archive -Path "$env:EXE_DIR\*" -DestinationPath xenity_build.zip

    # ⬆️ Upload artifact
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xenity-build
        path: xenity_build.zip