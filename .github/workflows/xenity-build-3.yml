name: Build Xenity Engine

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore dependencies
      run: nuget restore Xenity_Engine.sln

    - name: Build Engine + Editor
      run: msbuild Xenity_Engine.sln /p:Configuration=Release /p:Platform=x64

    - name: Find build output
      run: dir /s /b *.exe

    - name: Zip Output
      run: |
        powershell Compress-Archive -Path **\Release\* -DestinationPath xenity_build.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xenity-build
        path: xenity_build.zip
